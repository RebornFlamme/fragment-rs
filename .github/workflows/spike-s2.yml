# Spike S2 : captures RÉELLES du bureau du runner (calque GPUI sous la webview, popup au-dessus) en artifact.
# Le test lui-même tourne aussi dans `test-windows` ; ce job ne sert qu'à garder les PNG.
name: spike-s2

on:
  pull_request:
    paths:
      - "crates/fragment-html/**"
      - ".github/workflows/spike-s2.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: 0

jobs:
  captures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - run: cargo test -p fragment-html --test spike_s2 --locked -- --nocapture --test-threads=1 page_vivante
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-s2-captures
          path: target/spike-s2/*.png
          if-no-files-found: warn
