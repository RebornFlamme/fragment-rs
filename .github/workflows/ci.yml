# CI de fragment-rs (program.md §4, ADR-003).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ★ .cargo/config.toml pointe target/ hors OneDrive (C:/dev/…) pour le portable ;
  # sur les runners on le ramène dans l'espace de travail (et sous Linux ce chemin n'a pas de sens).
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  # ★ 11/11 : clippy passe sous Windows. Sous Ubuntu, l'étape apt (dépendances système de GPUI)
  # tombait en panne DNS des miroirs pendant plus de 20 min et bloquait toutes les PR.
  clippy:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-windows
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux
      # Crates pures : les crates UI (fragment-ui, fragment-app) sont vérifiées sous Windows.
      - name: pdfium (binaire épinglé, scripts/pdfium.sh)
        run: scripts/pdfium.sh
      - run: cargo test --workspace --locked --exclude fragment-ui --exclude fragment-app

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: pdfium (binaire épinglé, scripts/pdfium.ps1)
        shell: pwsh
        run: ./scripts/pdfium.ps1
      - run: cargo test --workspace --locked

  # fr-t3.4 : l'éditeur du live preview en RELEASE sur 10 000 lignes. Les temps sont imprimés
  # (`SURFACE|10k|…`) et le test échoue si la frappe ou le défilement dépasse 16 ms.
  editeur-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: editeur-release
      - name: pdfium (binaire épinglé, scripts/pdfium.ps1)
        shell: pwsh
        run: ./scripts/pdfium.ps1
      - run: cargo test -p fragment-ui --release --locked --test editeur dix_mille_lignes -- --nocapture

  # Fork n°1 (ADR-006) : vendor/gpui-base = gpui-base à la version ÉPINGLÉE par gpui-kit + un patch
  # minimal. Ce job rend la dette de rebase visible : il échoue si (1) la version vendored n'est plus
  # celle du Cargo.lock, (2) un fichier non déclaré dans vendor/gpui-base/NOTICE diverge de l'original,
  # (3) le patch (diff vendor/ contre l'original) ne s'applique plus proprement à l'original.
  fork-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff de vendor/gpui-base contre l'original épinglé
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -A1 '^name = "gpui-base"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "gpui-base épinglé (Cargo.lock) : $v"
          vv=$(sed -n 's/^version = "\(.*\)"$/\1/p' vendor/gpui-base/Cargo.toml | head -1)
          if [ "$v" != "$vv" ]; then
            echo "::error::vendor/gpui-base est en $vv mais gpui-kit épingle $v : rebaser le fork (ADR-006)"
            exit 1
          fi
          tmp=$(mktemp -d)
          curl -fsSL "https://static.crates.io/crates/gpui-base/gpui-base-$v.crate" -o "$tmp/o.crate"
          sha=$(sed -n 's/^ *sha256 \([0-9a-f]\{64\}\)$/\1/p' vendor/gpui-base/NOTICE)
          echo "$sha  $tmp/o.crate" | sha256sum -c -
          tar xzf "$tmp/o.crate" -C "$tmp"
          orig="$tmp/gpui-base-$v"
          # Fichiers déclarés modifiés dans NOTICE.
          grep -E '^  [A-Za-z0-9_./-]+\.rs ' vendor/gpui-base/NOTICE | awk '{print "src/input/"$1}' | sort > "$tmp/declared"
          # Fichiers qui divergent réellement (NOTICE est notre ajout ; Cargo.lock et .cargo_vcs_info.json ne sont pas vendored).
          (cd vendor/gpui-base && find . -type f ! -name NOTICE ! -name .cargo_vcs_info.json | sed 's|^\./||' | sort) > "$tmp/v.files"
          (cd "$orig" && find . -type f ! -name Cargo.lock ! -name .cargo_vcs_info.json | sed 's|^\./||' | sort) > "$tmp/o.files"
          : > "$tmp/changed"
          for f in $(sort -u "$tmp/v.files" "$tmp/o.files"); do
            if [ ! -f "vendor/gpui-base/$f" ] || [ ! -f "$orig/$f" ] || ! cmp -s "vendor/gpui-base/$f" "$orig/$f"; then
              echo "$f" >> "$tmp/changed"
            fi
          done
          sort -o "$tmp/changed" "$tmp/changed"
          echo "--- fichiers modifiés (réel) ---"; cat "$tmp/changed"
          if ! diff -u "$tmp/declared" "$tmp/changed"; then
            echo "::error::les fichiers qui divergent de l'original ne sont pas ceux déclarés dans vendor/gpui-base/NOTICE"
            exit 1
          fi
          # Le patch : produit, puis ré-appliqué à une copie neuve de l'original.
          mkdir "$tmp/a" "$tmp/b" "$tmp/c"
          cp -r "$orig/." "$tmp/a/"; rm -f "$tmp/a/Cargo.lock" "$tmp/a/.cargo_vcs_info.json"
          cp -r vendor/gpui-base/. "$tmp/b/"; rm -f "$tmp/b/NOTICE"
          cp -r "$tmp/a/." "$tmp/c/"
          (cd "$tmp" && diff -ruN a b > fork.patch || true)
          (cd "$tmp/c" && patch -p1 --no-backup-if-mismatch < ../fork.patch > /dev/null)
          if ! diff -r "$tmp/c" "$tmp/b" > /dev/null; then
            echo "::error::le patch ne s'applique plus proprement à l'original"
            exit 1
          fi
          added=$(grep -c '^+[^+]' "$tmp/fork.patch" || true)
          removed=$(grep -c '^-[^-]' "$tmp/fork.patch" || true)
          echo "Taille du patch : +$added -$removed lignes sur $(wc -l < "$tmp/changed") fichiers"
          cp "$tmp/fork.patch" "$GITHUB_WORKSPACE/gpui-base-fork.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-base-fork-patch
          path: gpui-base-fork.patch
      # Fork n°2 (ADR-017) : vendor/gpui-pre = l'archive de crates.io à la version épinglée + EXACTEMENT
      # vendor/gpui-pre.patch, rien d'autre. Toute modification glissée ailleurs dans l'arbre fait échouer.
      - name: Diff exact de vendor/gpui-pre contre l'archive + vendor/gpui-pre.patch
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -A1 '^name = "gpui-pre"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          vv=$(sed -n 's/^version = "\(.*\)"$/\1/p' vendor/gpui-pre/Cargo.toml | head -1)
          vw=$(sed -n 's/^gpui-pre = "=\(.*\)"$/\1/p' Cargo.toml)
          echo "gpui-pre : Cargo.lock $v, vendor $vv, [workspace.dependencies] $vw"
          if [ "$v" != "$vv" ] || [ "$v" != "$vw" ]; then
            echo "::error::vendor/gpui-pre n'est plus à la version épinglée : rebaser le fork (ADR-017)"
            exit 1
          fi
          tmp=$(mktemp -d)
          curl -fsSL "https://static.crates.io/crates/gpui-pre/gpui-pre-$v.crate" -o "$tmp/o.crate"
          sha=$(sed -n 's/^ *sha256 \([0-9a-f]\{64\}\)$/\1/p' vendor/gpui-pre/NOTICE)
          echo "$sha  $tmp/o.crate" | sha256sum -c -
          tar xzf "$tmp/o.crate" -C "$tmp"
          attendu="$tmp/gpui-pre-$v"
          rm -f "$attendu/Cargo.lock" "$attendu/.cargo_vcs_info.json"
          (cd "$attendu" && patch -p1 --no-backup-if-mismatch < "$GITHUB_WORKSPACE/vendor/gpui-pre.patch")
          if ! diff -r -x NOTICE "$attendu" vendor/gpui-pre; then
            echo "::error::vendor/gpui-pre diffère de l'archive + vendor/gpui-pre.patch (ADR-017 : aucun autre changement)"
            exit 1
          fi
          echo "Fichiers touchés par le patch :"; grep '^+++ ' vendor/gpui-pre.patch
          echo "Taille du patch : +$(grep -c '^+[^+]' vendor/gpui-pre.patch) -$(grep -c '^-[^-]' vendor/gpui-pre.patch || true) lignes"
          # Dette de rebase : la dernière version publiée, pour mémoire (n'échoue pas).
          last=$(curl -fsSL -A "fragment-rs-ci" https://crates.io/api/v1/crates/gpui-pre | sed -n 's/.*"max_version":"\([^"]*\)".*/\1/p' || true)
          echo "Dette de rebase : fork en $v, dernière version publiée : ${last:-inconnue}"

  check-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - run: cargo check -p fragment-app --locked

  # Parité au pixel. Phase 0 : PREUVE que la capture hors écran marche sur le runner
  # (scènes « fenetre-vide » et « mire » capturées deux fois, comparées à elles-mêmes : 0 pixel attendu ;
  # la mire prouve que le rasterizeur dessine quads, traits et glyphes).
  # Dès qu'une scène a référence ET candidat, `cargo xtask pixels` les compare aussi.
  pixels:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pixels
      # ★ L'écran du runner est en 1024×768 : Windows rogne une fenêtre 1280×800 (constaté au 1er run,
      # capture 1024×720). On agrandit l'écran AVANT d'ouvrir la fenêtre ; fragment-pixels vérifie la taille.
      - name: Écran 1920×1080 et adaptateur graphique
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Format-List Name, CurrentHorizontalResolution, CurrentVerticalResolution
      - name: pdfium (binaire épinglé, scripts/pdfium.ps1)
        shell: pwsh
        run: ./scripts/pdfium.ps1
      - run: cargo build -p fragment-app --features pixels --bin fragment-pixels --bin fragment --locked
      # Le binaire de la tranche démarre (fr-t1-binaire) : la fenêtre s'ouvre sur un dossier de travail
      # neuf, le processus tient, et le layout par défaut est écrit dans .fragment/workspace.json
      # (débounce de 2 s). La scène de contrôle `t1-binaire` vérifie ensuite le rendu et le clavier.
      - name: Démarrage du binaire
        shell: pwsh
        run: |
          $dossier = Join-Path $env:RUNNER_TEMP 'fragment-demarrage'
          New-Item -ItemType Directory -Force $dossier | Out-Null
          $p = Start-Process -FilePath target/debug/fragment.exe -ArgumentList "`"$dossier`"" -PassThru `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'fragment-stderr.txt')
          Start-Sleep -Seconds 10
          $ws = Join-Path $dossier '.fragment/workspace.json'
          $vivant = -not $p.HasExited
          if ($vivant) { Stop-Process -Id $p.Id -Force }
          Get-Content (Join-Path $env:RUNNER_TEMP 'fragment-stderr.txt') -ErrorAction SilentlyContinue
          if (-not $vivant) { throw "fragment.exe s'est arrêté (code $($p.ExitCode))" }
          if (-not (Test-Path $ws)) { throw "workspace.json non écrit dans $dossier" }
          Get-Content $ws
      - name: Capture n°1
        run: target/debug/fragment-pixels.exe pixels/scenes pixels/candidate
      - name: Capture n°2
        run: target/debug/fragment-pixels.exe pixels/scenes pixels/candidate-2
      # fr-p4.1.3 (mesure, non bloquant) : réglages de texte du runner, en lecture seule. Depuis
      # fr-p4.1.4 (ADR-017), le candidat est en ClearType sur les surfaces opaques, gris dans les calques.
      - name: Réglages de texte du runner (ClearType, DPI, Avalon.Graphics)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' | Format-List FontSmoothing, FontSmoothingType, FontSmoothingGamma, FontSmoothingOrientation, LogPixels, Win8DpiScaling
          "HKCU Avalon.Graphics : $(Test-Path 'HKCU:\SOFTWARE\Microsoft\Avalon.Graphics')"
          Get-ChildItem 'HKCU:\SOFTWARE\Microsoft\Avalon.Graphics' -Recurse -ErrorAction SilentlyContinue | Format-List
          Get-ItemProperty 'HKCU:\Control Panel\Desktop\PerMonitorSettings\*' -ErrorAction SilentlyContinue | Format-List PSChildName, DpiValue
          Get-CimInstance Win32_DesktopMonitor | Format-List Name, PixelsPerXLogicalInch
      - name: Preuve — fenêtre vide et mire comparées à elles-mêmes (strict, 0 pixel)
        run: |
          foreach ($f in 'fenetre-vide-dark.png', 'mire-dark.png') {
            foreach ($d in 'pixels/candidate', 'pixels/candidate-2') {
              if (-not (Test-Path "$d/$f")) { throw "capture absente : $d/$f" }
            }
          }
          # ★ fr-p3.1 : xtask en release (la contre-épreuve par glyphe triple la durée en debug).
          cargo run --release --quiet -p xtask -- pixels --reference pixels/candidate-2 --candidate pixels/candidate --diff pixels/diff/preuve --report pixels/diff/preuve.md
      - name: Parité avec Fragment (scènes ayant référence et candidat)
        shell: bash
        run: |
          shopt -s nullglob
          paires=0
          for c in pixels/candidate/*.png; do [ -f "pixels/reference/$(basename "$c")" ] && paires=$((paires+1)); done
          if [ "$paires" -gt 0 ]; then cargo run --release --quiet -p xtask -- pixels --exiger-references; else echo "Aucune scène n'a encore référence + candidat (phase 0)."; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixels
          path: |
            pixels/candidate/
            pixels/diff/
            docs/parite-pixels.md
          if-no-files-found: ignore
