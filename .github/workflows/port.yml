# Voie C (program.md §2) : un agent `claude -p` traite UNE tâche Beads et ouvre une PR.
# Prérequis : le secret ANTHROPIC_API_KEY, posé par l'utilisateur lui-même
# (`gh secret set ANTHROPIC_API_KEY -R RebornFlamme/fragment-rs`) — jamais par un agent.
# La tâche est lue dans l'export du registre commité (`.beads-export/issues.jsonl`,
# régénéré par le chef via `scripts/wave.ps1`) : la base Dolt reste sur le portable.
name: port

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Identifiant Beads (fr-xxxx)"
        required: true
      budget:
        description: "Plafond en dollars pour ce job"
        required: false
        default: "3"

concurrency:
  group: port-${{ inputs.task }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  HAS_FRAGMENT_TOKEN: ${{ secrets.FRAGMENT_READ_TOKEN != '' }}

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ★ Fragment (la spec) est un dépôt PRIVÉ : sa lecture exige un jeton à lecture seule
      # posé par l'utilisateur (`gh secret set FRAGMENT_READ_TOKEN`), monté dans `fragment-ref/`
      # (jamais commité : voir .gitignore). Sans lui, le job échoue d'emblée (« secret absent »).
      - name: Référence Fragment disponible ?
        if: env.HAS_FRAGMENT_TOKEN != 'true'
        run: |
          echo "::error::secret absent : FRAGMENT_READ_TOKEN (à poser par l'utilisateur). Pas de port à l'aveugle sans la référence TS."
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: RebornFlamme/Fragment
          token: ${{ secrets.FRAGMENT_READ_TOKEN }}
          path: fragment-ref
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Lire la tâche
        id: tache
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          ligne=$(jq -c --arg id "$TASK" 'select(.id == $id)' .beads-export/issues.jsonl | head -n1)
          if [ -z "$ligne" ]; then echo "Tâche $TASK absente de .beads-export/issues.jsonl" >&2; exit 1; fi
          echo "$ligne" | jq -r '"# \(.id) — \(.title)\n\n\(.description // "")\n\n\(.notes // "")"' > "$RUNNER_TEMP/tache.md"
          cat "$RUNNER_TEMP/tache.md"
      - name: Branche
        env:
          TASK: ${{ inputs.task }}
        run: |
          git config user.name "fragment-rs port"
          git config user.email "port@users.noreply.github.com"
          git checkout -B "task/$TASK"
      - name: Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ inputs.task }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          brief="Tu es un équipier de fragment-rs (voie C). Lis CLAUDE.md puis program.md §3, §6, §9. Ta tâche Beads est ci-dessous ; tu ne possèdes QUE les fichiers qu'elle déclare. La référence Fragment est montée dans fragment-ref/ (un chemin C:\…\Fragment\app\x devient fragment-ref/app/x) ; ne commite jamais fragment-ref/. Tests d'abord (un #[test] par cas TS, même nom en snake_case), puis l'implémentation. Vérifie avec la commande de la tâche (cargo test -p …), cargo fmt et cargo clippy -p <crate> -- -D warnings. Commite (message « port : <module> », en français) sur la branche courante ; ne pousse pas, n'ouvre pas de PR : le workflow le fait.

          $(cat "$RUNNER_TEMP/tache.md")"
          claude -p "$brief" --model claude-sonnet-5-5 --max-budget-usd "$BUDGET" --dangerously-skip-permissions --output-format text
      - name: Pousser et ouvrir la PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then echo "Aucun commit produit." >&2; exit 1; fi
          git push --force-with-lease origin "task/$TASK"
          titre=$(jq -r --arg id "$TASK" 'select(.id == $id) | .title' .beads-export/issues.jsonl | head -n1)
          gh pr create --base main --head "task/$TASK" --title "$TASK : $titre" --body "Tâche Beads \`$TASK\` (voie C, \`port.yml\`, run ${{ github.run_id }}).

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" || gh pr view "task/$TASK"
