# Table de parité de fragment-text (program.md §6, ADR-002 : un `parite.toml` par
# crate ; `docs/parite-tests.md` est régénéré par le chef, `cargo xtask parite`).
#
# Schéma (proposé par la première tâche de phase 1, à figer dans xtask) :
#   [[module]]        un module TS porté
#   source            le fichier TS (chemin sous Fragment/app/src/)
#   tests_source      son fichier de tests TS ("" : il n'en a pas)
#   rust              le fichier Rust
#   tests_rust        le fichier de tests Rust (un #[test] par cas TS, même nom en snake_case)
#   cas_source        nombre de `it(...)` dans tests_source
#   cas_portes        nombre de ces cas portés un pour un
#   cas_ajoutes       cas écrits en plus (module sans tests TS, ou règle testée seulement en e2e)
#   [[module.non_porte]]  un cas TS non porté : son titre et la raison
#   note              ce que le port a dû trancher (repris dans la PR)

crate = "fragment-text"
tache = "fr-p1-text"

[[module]]
source = "ui/core/editor/Editor.ts"
tests_source = "ui/core/editor/mapRange.test.ts"
rust = "src/editor.rs"
tests_rust = "tests/map_range.rs"
cas_source = 2
cas_portes = 2
cas_ajoutes = 0
note = "Contrats DocumentSurface / TextSurface / Editor en traits ; les gardes TS (hasText, isEditable) deviennent as_text / as_editor redéfinis par les surfaces ; fullText tri-état → enum FullText. Les membres DOM (contentEl, scrollEl, cm, Marker, addLayer, onChange) ne sont pas dans le contrat : présentation (fragment-ui). LineBlock (déclaré, inutilisé en TS) non porté."

