[package]
name = "fragment-html"
description = "Pages HTML : pont (htmlBridge, htmlTextModel), hôte webview (S2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Socle T9 (fr-t9-socle) : le texte aplati et les jetons que la page reçoit. Aucune dépendance externe.
fragment-text = { path = "../fragment-text" }
fragment-theme = { path = "../fragment-theme" }

# Spike S2 (tests/spike_s2.rs, examples/spike_s2.rs) : GPUI et WebView2 ne sont tirées que sous Windows,
# comme S1 et S3 — le job `test-linux` n'installe pas les bibliothèques système de GPUI.
# ★ gpui-webview 0.9.1 n'EXIGE PAS `gpui-fast` (feature facultative, macOS/Linux seulement) ; on ne
#   l'active donc pas : un seul GPUI (celui de gpui-kit). `lb-wry` est le wry de Longbridge, celui de gpui-webview.
[target.'cfg(windows)'.dev-dependencies]
gpui-kit.workspace = true
gpui-webview = "=0.9.1"
wry = { version = "=0.53.3", package = "lb-wry" }
serde_json.workspace = true
raw-window-handle = "0.6"
fragment-text = { path = "../fragment-text" }
# Spike S10 (CapturePreview, MoveFocus) : les versions que lb-wry tire déjà (aucune crate nouvelle au lock).
# Licences : webview2-com MIT ; windows MIT OU Apache-2.0 ; image MIT OU Apache-2.0 (ADR-019).
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
image.workspace = true

[lints]
workspace = true
