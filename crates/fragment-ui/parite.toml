# Parité des tests de fragment-ui pour la tranche T1 (fr-t1-binaire, T1.md choix 5 : ce fichier est
# tenu par la seule tâche d'assemblage). Le rendu n'a pas de `.test.ts` : la source des cas, ce sont
# les specs e2e de Fragment (`app/e2e/*.spec.ts`), un `test(...)` = un cas. Un cas porté = un `#[test]`
# du même nom en snake_case, sans accents, dans `crates/fragment-ui/tests/*.rs` ou, pour le démarrage
# et le clavier de l'application, `crates/fragment-app/tests/*.rs` (le banc a besoin du binaire
# assemblé). Les cas « n.a. » le sont pour T1, avec leur tranche.
# Le rendu lui-même est jugé au pixel (`docs/parite-pixels.md`), pas ici.

[crate]
name = "fragment-ui"
tache = "fr-t1-binaire"
reference = "RebornFlamme/Fragment (specs e2e de T1, T1.md §1)"

[[module]]
ts = "app/e2e/workspace-structure.spec.ts"
rs = "crates/fragment-ui/tests/splits.rs"
