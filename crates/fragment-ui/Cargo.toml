[package]
name = "fragment-ui"
description = "L'app GPUI : shell du workspace sur gpui-kit, vues, calques, barres (phase 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# build.rs : liste les fichiers de assets/ pour les embarquer sans maintenir de table à la main.
build = "build.rs"

[dependencies]
# Le cœur ne connaît pas gpui-kit ; c'est fragment-ui qui les rapproche.
fragment-core = { path = "../fragment-core" }
fragment-theme = { path = "../fragment-theme" }
# Le modèle de la barre d'outils (sections, groupes, orientation) est déjà porté là (fr-t1-menus).
fragment-annotation = { path = "../fragment-annotation" }
# Socle T2-T4-T11 : les crates de modèle que les vues aval rapprochent de GPUI.
fragment-text = { path = "../fragment-text" }
fragment-markdown = { path = "../fragment-markdown" }
fragment-pdf = { path = "../fragment-pdf" }
fragment-cli = { path = "../fragment-cli" }
# Les maths en ligne (ADR-011) : MathJax dans QuickJS, sans gpui-kit.
fragment-maths = { path = "../fragment-maths" }
# Socle T5-T7 (fr-p3-socle-t5t7) : les calques, le chat et l'agent que les vues aval rapprochent de GPUI.
fragment-layers = { path = "../fragment-layers" }
fragment-chat = { path = "../fragment-chat" }
fragment-agent = { path = "../fragment-agent" }
# Socle T6 (fr-t6-socle) : les modules purs des artefacts (journal, records, kinds) que l'app rapproche de GPUI.
fragment-artefacts = { path = "../fragment-artefacts" }
# La marge de lecture (fr-t5-mode-marge) : le tableau des trois commandes, déjà porté là.
fragment-plugins = { path = "../fragment-plugins" }
# Socle T9 (fr-t9-socle) : les pages HTML et leur pont.
fragment-html = { path = "../fragment-html" }
# Les arguments des commandes de scène (`pixels:args`) sont des `serde_json::Value`.
serde_json.workspace = true
gpui-kit.workspace = true
# Les images d'ombre du calque (fr-p4.1, ADR-013) : `image::Frame` de `RenderImage`. Déjà tirée par
# GPUI (même version, 0.25) et dans le workspace. Feature `jpeg` : la vignette d'une pièce JPEG (fr-3t0).
image = { workspace = true, features = ["jpeg"] }
# Le HTML du Markdown (fr-t3-html-rendu, ADR-012) : analysé par html5ever en arbre rcdom, les mêmes
# versions que celles que `gpui-base` tire déjà (aucune crate nouvelle au lock).
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# La boîte de couleur native (fr-t11.4, ADR-018) : `ChooseColorW`. Même version (0.62.2) que celle que
# `gpui-pre` tire déjà : aucune crate nouvelle au lock, seulement deux features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Test headless de résolution des polices : TextSystem de la plateforme, sans fenêtre.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
