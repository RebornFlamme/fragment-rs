# Parité de fr-t2-montage (fragment-ui) : la vue de fichier de test et l'en-tête de l'explorateur.
# Le montage du coffre (fragment-app/src/coffre.rs) est testé dans crates/fragment-app/tests/coffre.rs.

[[module]]
ts = "app/src/ui/core/workspace/FileView.ts, e2e/view-header-nav.spec.ts"
rs = "crates/fragment-ui/src/vue_fichier/mod.rs"
cas_source = 1
cas_portes = 1
cas_ajoutes = 5
notes = "Le test e2e de view-header-nav est découpé en quatre tests headless (← actif / → inactif, retour, avance, historique qui suit un renommage) sur VueFichierSimple. Non traduit : le centrage du titre à ±2 px (du rendu, scène t2-fil-ariane en T3) et les clics sur les boutons (testés par l'état de l'historique). Ajoutés : segments du fil d'Ariane, reveal_folder qui émet reveal-in-folder."

[[module]]
ts = "app/src/ui/views/explorer/FileExplorerView.tsx (nav-header), explorer.css"
rs = "crates/fragment-ui/src/explorateur/vue.rs (rendre_en_tete)"
cas_source = 0
cas_portes = 0
cas_ajoutes = 0
notes = "Les quatre boutons de l'en-tête (nouvelle note, nouveau dossier, trier, tout replier) : jugés par les scènes pixels t2-explorateur*. Le bouton « Nouvelle note » appelle la création de la vue, pas la commande file-explorer:new-file (même effet : newFileLocation n'est pas porté, racine)."

[[module]]
ts = "app/src/ui/views/treeItem.css (guide, chevron), explorer.css (.nav-rename-input), core/menu.css, index.css (::selection)"
rs = "crates/fragment-ui/src/tree_item/{couleurs,rendu}.rs, crates/fragment-ui/src/menu.rs, crates/fragment-ui/src/explorateur/{vue,renommer}.rs, crates/fragment-ui/src/flottant.rs"
cas_source = 0
cas_portes = 0
cas_ajoutes = 1
notes = "Corrections de rendu jugées par les scènes t2-explorateur* : guide composé comme un remplissage de Chromium (59,58,59 / 196,195,192, test le_guide_tombe_sur_la_capture_de_fragment) ; chevron coloré explicitement (un svg de GPUI n'hérite pas du text_color), survol par groupe ; menu à la largeur ajustée de Chromium (fraction gardée, arête arrondie) ; arrondi du fond de survol d'une ligne déclaré quand le pointeur est dessus ; renommage sans rendre la ligne active, titre entièrement sélectionné à l'ouverture (fond ::selection, accent 35 % en remplissage) et sans curseur. Écarts acceptés (chef) : (1) le premier .md du layout par défaut s'ouvre en onglet VIDE (pas de vue Markdown avant T3) ; (2) presse-papiers et frappes du renommage non branchés par le shell (ActionsExplorateur sans presse-papiers, saisir / touche_renommage non routés) ; (3) fil d'Ariane non dessiné dans l'en-tête (ses scènes t2-fil-ariane / t2-entete-nav-actif sont en T3)."
