ts = "app/src/ui/views/agent/AgentPlugin.ts (AgentSettingTab : moteur, modèle, nom, orbe, barre, permissions), harness/claudeSetup.ts (apiKeySetting), e2e/agent-permissions.spec.ts (test « les RÉGLAGES déclaratifs », « Toujours dans ce coffre »), e2e/agent-trace.spec.ts (orbe choisie)"
