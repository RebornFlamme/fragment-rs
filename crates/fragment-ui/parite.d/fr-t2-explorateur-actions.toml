# Parité de fr-t2-explorateur-actions (fragment-ui) : les actions de l'explorateur (menus fichier,
# dossier et racine, création, renommage en place, corbeille, déplacer vers…, glisser-déposer,
# fichiers du système importés). Six cas e2e côté TS (explorer-menus.spec.ts), portés sous le même
# nom en snake_case dans crates/fragment-ui/tests/explorateur_actions.rs ; les autres cas sont
# ajoutés d'après FileTree.tsx.

[[module]]
ts = "app/e2e/explorer-menus.spec.ts ; app/src/ui/views/explorer/FileTree.tsx (ouvrirMenuFichier, creerNote, creerDossier, cheminLibre, copierDe, cheminSysteme, RenameInput, commitRename, FolderSuggestModal, folderOf, freePath, importFiles, dropFolderPath, SPRING_DELAY, setTarget / collapseStale / endDrag, file-drag-over / file-move) ; app/src/ui/core/DragManager.ts ; app/src/ui/core/FuzzySuggestModal.ts"
rs = "crates/fragment-ui/src/explorateur/{menu,renommer,deplacer,glisser}.rs, crates/fragment-ui/src/explorateur/vue.rs (actions), crates/fragment-ui/src/glisser/mod.rs (glisser de fichier), crates/fragment-ui/tests/explorateur_actions.rs"
cas_source = 6
cas_portes = 6
cas_ajoutes = 46
notes = "Porté : les trois menus (entrées, sections et ordre du TS ; hook file-menu ; racine sans copie, déplacement, renommage ni suppression), nouvelle note et nouveau dossier au premier nom libre, faire une copie (fichier ou dossier) puis renommage sur la copie, renommage en place (fichier sans extension recollée au commit, Entrée valide, Échap annule, vide ou inchangé ignoré, collision refusée par le coffre et signalée), supprimer vers la corbeille système ou .trash selon le réglage, copier le chemin (sous-menu vault / système, notice), ouvrir dans un onglet / à droite / l'app / l'explorateur système (rappels de l'application), déplacer vers… (modale floue des dossiers, source, descendants et parent exclus), glisser un fichier sur un dossier ou un fichier (file-move), glisser un fichier vers une pile du workspace (ouvre un onglet par les zones de dépôt de fr-t1-splits), fichiers du système importés au nom libre (dossiers ignorés), ressort de 450 ms (ouvre un dossier fermé, referme ce qu'il a ouvert en quittant, garde ouvert au lâcher). Écarts : (1) le champ de renommage est TEXTUEL : la saisie remplace le nom, suivie d'un curseur ▏ ; la vue n'est pas une entité GPUI, elle n'a pas de focus : les frappes lui sont livrées par `saisir` / `touche_renommage` (le shell du montage les route) et la perte du focus valide par `valider_renommage` ; pas de sélection ni de curseur déplaçable (même dette que suggest) ; (2) le ressort avance à chaque mouvement du pointeur et à chaque image, pas par minuterie : un curseur immobile sur un dossier fermé ne l'ouvre qu'au prochain mouvement ou à la prochaine image ; (3) les rappels (presse-papiers, onglet, système, corbeille système, hook file-menu) sont fournis par l'application dans ActionsExplorateur : le montage les branche (fr-t2-montage) ; (4) pas de scène de pixels : menu et ligne de dépôt existent déjà (t1-menu, tree-item) ; la ligne de renommage n'a pas de référence Fragment propre ; (5) icônes Lucide ajoutées à assets/icons (square-pen, folder-plus, file-plus-2, folder-tree, clipboard-copy, hard-drive, arrow-up-right, pencil-line, folder) ; (6) ajouts minimaux hors fichiers possédés, signalés dans la PR : glisser/mod.rs (crochets du glisser de FICHIER, appui de fichier, relais des évènements du cœur) et vue.rs / mod.rs de fr-t2-explorateur (état des actions, rendu du renommage et du dépôt)."
