# Parité de fr-t3-tableaux (fragment-ui) : le tableau du live preview, ses cellules imbriquées et ses menus.
# Schéma `parite.d` : un fichier par tâche. Le widget TS n'a pas de test unitaire (tableModel.test.ts est porté
# par fragment-markdown/table_model) : les cas viennent de la spec e2e markdown-table (12 tests) et de
# editor-hell (undo croisé, taper sous un tableau final), portés en headless dans tests/md_tableau.rs.

[[module]]
ts = "app/src/ui/views/markdown/table/TableWidget.ts, cellEditor.ts, tableField.ts, tableMenu.ts, table.css"
rs = "crates/fragment-ui/src/md_tableau/widget.rs, hote.rs, menus.rs, controle.rs, geometrie.rs"
cas_source = 12
cas_portes = 11
cas_ajoutes = 13
non_portes = [
  { cas = "markdown-table : coller une image dans une cellule", raison = "pièce jointe (pasteImage) : livrée avec les pièces jointes de T9" },
]
notes = "e2e markdown-table portés : grille (rendu, frappe, Tab, undo, + droite / bas, glisser colonne et ligne), editor:insert-table, trop de colonnes (défilement), clic sous un tableau final, Backspace en deux temps, maths et gras rendus hors focus, menu de poignée de colonne, clic droit tableau / cellule, taper sous le dernier tableau, Suppr / Retour arrière sur un choix ; blocs $$ : seul le cas « milieu de cellule » et la phrase de la note (le $$ EN DÉBUT de cellule est un BlockMath de mathBlockField, non monté dans une cellule : écart). Non porté : coller une image dans une cellule (pièce jointe : pasteImage, T9). Ajoutés : undo croisé cellule / texte (editor-hell), 11 unitaires (géométrie, contrôle, écriture de cellule) et le test du crochet marges / interligne (tests/editeur.rs). Écarts : (1) la frappe dans une cellule n'écrit QUE sa cellule, sans réaligner les colonnes du source (Fragment re-sérialise ; l'historique du fork ne regroupe que des insertions pures, une re-sérialisation ferait un undo par caractère) — les opérations de structure re-sérialisent ; (2) largeurs de colonnes mesurées sur la SOURCE de la cellule (marques comprises), mise en page auto de <table> approchée (min/max-content au prorata) ; (3) icônes de menu absentes du registre (between-*, text-align-*, arrow-*-a-z, table) ; (4) actions du menu d'édition d'une cellule remises à la vue (Tableau::poser_edition) ; (5) infobulle des bandes sans ombre ni position fixe ; (6) scènes t3-tableau* à fr-t3-scenes-b / livraison."
