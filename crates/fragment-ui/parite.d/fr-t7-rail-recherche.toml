# Parité de fr-t7-rail-recherche (fragment-ui). Schéma `parite.d` : un fichier par tâche. rail.test.ts et
# searchModel.test.ts sont portés dans fragment-chat (fr-t7 socle) ; ici les cas headless suivent
# app/e2e/chat-scroll.spec.ts (principe 10 : rail, Ctrl+F, lien de message, test 3 : Ctrl+F coupe le suivi).

[[module]]
ts = "app/src/ui/views/chat/scroll/{rail,search}.ts, app/src/ui/views/chat/ChatView.ts (majDefilement : tours, ligne Nouveau ; allerAuMessage), app/src/ui/views/chat/ChatPlugin.ts (copy-link), app/e2e/chat-scroll.spec.ts"
rs = "crates/fragment-ui/src/chat_rail/{mod,modele,rail,recherche}.rs, crates/fragment-ui/tests/chat_rail.rs"
cas_source = 4
cas_portes = 4
cas_ajoutes = 9
notes = "Portés : 10 rail (un tiret par tour à partir de 3, proximité, aperçu question / réponse / fichier au survol, un clic place le tour en haut, Alt+↓ / Alt+↑ = tour_voisin du défileur), 10 lien #m5 (rang_du_lien → le 5e message en haut), 3 et 10 Ctrl+F (coupe le suivi, compteur 1 / 1, surlignage par le calque, Échap l'efface). Ajoutés : tours_du_rail, premier_non_lu et lien_du_message (pure, testée dans le module), Entrée / Maj+Entrée cycliques, sans accents ni casse, Aucun résultat, requête gardée à la réouverture, relancer, style du surlignage, ↑ ↓ Entrée au clavier du rail. Écarts et dettes : (1) ★ FRAGMENT : `.range-highlight.chat-search-match.is-current` lit `--text-highlight-bg-active`, défini NULLE PART : la déclaration est invalide, le fond du résultat courant est transparent (l'utilisateur ne le distingue que par le compteur). Porté tel quel (surlignages/style.rs, ajout minimal hors liste, à signaler au chef) ; (2) le mélange du tiret est en OKLab (color-mix in oklab) recalculé en Rust, non vérifié contre une capture : il revient à la tâche de scènes ; (3) la carte d'aperçu se centre sur le tiret mais n'est pas bornée au pane (marge de 8 px) ; (4) les tirets ne sont pas des boutons tabulables : le rail entier prend le focus, ↑ ↓ déplacent le tiret courant, Entrée le déclenche ; (5) le résultat de la recherche amène le MESSAGE qui le porte en haut (Defileur::reveler), non la position au tiers du haut de la vue ; (6) le halo `is-flashed` du message rejoint par un lien, la pose de la ligne Nouveau dans la liste (ligne_nouveau est fournie), l'écouteur du lien #mN, l'action « Copier le lien du message » (lien_du_message fournie) et le lien de Ctrl+F à RechercheChat::ouvrir sont du montage (fr-t7-vue / fr-t7-montage). Le suivi des lus (1 s à l'écran) est SuiviLus (fr-t7-defilement). Ajout minimal hors liste : surlignages/style.rs (classe chat-search-match)."
