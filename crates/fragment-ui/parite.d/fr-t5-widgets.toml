# Parité de fr-t5-widgets (fragment-ui). Schéma `parite.d` : un fichier par tâche. Pas de test unitaire TS
# pour la moitié DOM de WidgetLayer.ts : la source est e2e (viewport, gutter-arbiter, gutter-room,
# widget-anchor), portée en headless (tests/widget_couche.rs) sur une FAUSSE surface de texte et les
# widgets de TEST réécrits (rigide = le globe, flex, seuil, vue nue = les cartes).
#
# Présentation : un WidgetLayer par calque sur l'hôte (arbitre et actif partagés) ; pilote avant les plans
# (microtâches, essais, focus relevé), pilote après (empreinte des éléments : une image suit tant qu'elle
# bouge) ; appui / relâché en capture sur la fenêtre, cible par boîte, actif au tour suivant. Ajout minimal à
# calques/hote.rs : poser_taille invalide l'arbitre pour un élément de marge (le ResizeObserver du TS).
# Écarts : la cible d'un appui est la boîte du widget le plus haut (pas l'arbre DOM ; un widget pass_through
# compte comme cible) ; « dans un menu » = un menu de fragment-ui ouvert (les modales n'ont pas d'état
# global : le montage le branche par poser_ephemere) ; le focus est relevé par FocusHandle confiée
# (suivre_focus) ; le rigide est un disque plein (pas de dégradé radial), les couleurs des widgets de test
# sont des jetons (color_red à 15 %, color_blue), pas les littéraux des fixtures.

[[module]]
ts = "app/e2e/viewport.spec.ts (WidgetLayer.ts : LazyWidget toDOM / destroy, focusout ; WidgetActivation.ts)"
rs = "crates/fragment-ui/src/widget_couche/{mod,couche,paresseux,essai,scene}.rs, crates/fragment-ui/tests/widget_couche.rs"
cas_source = 9
cas_portes = 6
cas_ajoutes = 3
notes = "« Aller à » : l'activation attend la construction (WidgetDeclare::au_prochain_montage). Ajoutés : appui dans un menu (pas dehors), clic droit dehors sans effet, actif seulement après le geste (et le clic reçu)."

