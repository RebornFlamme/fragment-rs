[package]
name = "fragment-maths"
description = "Rendu des maths `$…$` / `$$…$$` : MathJax 3.2.1 dans QuickJS, SVG peint par resvg (ADR-011)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Rastérisation des SVG : déjà au lock (par gpui), même version.
resvg = "0.45"
