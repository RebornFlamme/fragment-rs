tests_source = "ui/core/layers/GutterArbiter.test.ts"
rust = "src/gutter_arbiter.rs"
tests_rust = "tests/gutter_arbiter.rs"
cas_source = 3
cas_portes = 3
cas_ajoutes = 4
note = "Le DOM de l'arbitre (getClientRects, offsetHeight, style.top, `--gutter-room`, classe `is-gutter-clustered`) passe par le trait SlotElements ; le ResizeObserver devient `invalidate()` appelé par l'hôte. ★ Le temps : `queueMicrotask` devient un drapeau (`needs_flush`) vidé par `run_microtasks()` — passe en attente, puis annonces de grappes (hors passe). Les rappels s'exécutent sur un INSTANTANÉ des slots (une passe peut en poser/retirer). 4 cas ajoutés : placement/on_move, place annoncée avant la mesure, non affiché + actif épinglé, retrait d'un slot."

[[module]]
