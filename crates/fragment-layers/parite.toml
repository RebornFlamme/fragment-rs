# Table de parité de fragment-layers (program.md §6, ADR-002 : un `parite.toml` par
# crate ; `docs/parite-tests.md` est régénéré par le chef, `cargo xtask parite`).
# Schéma : celui de crates/fragment-text/parite.toml.
#
# Périmètre : le MODÈLE des calques (ancres, remappage, bande de marge, arbitrage,
# actif). La présentation (DOM → éléments gpui) est la phase 3 (fragment-ui) ; elle
# implémente `OverlayHost` / `WidgetElements` / `SlotElements` et traduit ses
# événements en appels du modèle.

crate = "fragment-layers"
tache = "fr-p1-layers"

[[module]]
source = "ui/core/layers/gutterStack.ts"
tests_source = "ui/core/layers/gutterStack.test.ts"
rust = "src/gutter_stack.rs"
tests_rust = "tests/gutter_stack.rs"
cas_source = 21
cas_portes = 21
cas_ajoutes = 0
note = "Calcul pur en f64 (±∞ comme en TS). Le PRNG mulberry32 est refait à l'identique en u32 (wrapping) ; le mélange de l'entrée du test de propriétés (`sort(() => r() - 0.5)`, dépendant du moteur) devient un Fisher-Yates à la même graine — même propriété testée."

