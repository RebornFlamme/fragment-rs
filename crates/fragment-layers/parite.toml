note = "Machine à états sans DOM : l'hôte traduit pointerdown/pointerup/setTimeout/focusin en `pointer_down` / `pointer_up` / `run_timers` / `focus_in` ; la classe `is-widget-active` se lit par `active_el` / `on_active_change`. « contient » vient d'un trait `ElementTree`. Les gestes du TS (un objet par pointerdown) gardent leur identité par un numéro. 3 cas ajoutés : menu/modale (in_overlay), élément retiré pendant le geste, désabonnement."

