note = "Les types de DONNÉES (CompactInfo, GutterMember, GutterCluster, LayerInstanceRef, LayerPreset, layer_instance_key, LayerMenuSection, GutterSide, OverlayPlane). L'élément DOM devient `ElementId` (opaque), la feuille `LeafId`. `GutterMember::pos` est un rappel (l'ancre est LUE à l'usage, jamais copiée) ; l'identité (`===`) devient `Rc::ptr_eq`. LayerMenuSection COLLECTE ses actions au lieu de rendre un HTMLElement."

