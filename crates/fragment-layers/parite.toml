note = "OverlayHost en trait (+ `content_client_rect`, ajout : le `contentEl` du TS n'est pas dans DocumentSurface). WidgetElements : les `el.style.*` et mesures que WidgetLayer lisait/écrivait sur le DOM. LayerContext ne garde que le pur (editor, doc lu à l'usage, overlays, instance, close) ; LayerSpec.appliesTo prend la vue en `&dyn Any` (View n'est pas dans le cœur)."

