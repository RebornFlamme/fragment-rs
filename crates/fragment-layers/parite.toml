tests_rust = "tests/widget_layer.rs"
cas_source = 3
cas_portes = 3
cas_ajoutes = 23
note = "Le MODÈLE : WidgetAnchor (enum + `TextAnchored` pour `map_anchor` de fragment-text), remappage et détachement en viewport, passe lire-puis-écrire, bande de marge, masquage prioritaire, widgets déclarés (LazyWidget) construits/détruits par le viewport. `mapAnchor.test.ts` (3 cas) est déjà porté dans fragment-text sur une union locale : 1 cas ajouté ici le rejoue sur la vraie `WidgetAnchor`. `toDOM` asynchrone → `DomBuild::Pending` + `deliver(ticket)` (le ticket est le `jeton` du TS). queueMicrotask `revoir` → `run_microtasks`, requestAnimationFrame → `run_frame`, focusout → `focus_out`, editor.onChange → `on_editor_change`. L'identité d'ancre (`w.anchor !== a`) devient un numéro de génération. 23 cas ajoutés (le TS n'en teste que 3 hors mapAnchor : le reste n'était couvert que par les e2e)."

[[module.non_porte]]
cas = "la présentation de WidgetLayer (el.style.*, offsetLeft, getBoundingClientRect, document.activeElement, addEventListener('focusout'))"
raison = "DOM : trait WidgetElements, implémenté par fragment-ui (phase 3)"

[[module.non_porte]]
cas = "gutterAnchorAt : editor.contentEl.getBoundingClientRect()"
raison = "contentEl n'est pas dans le contrat de DocumentSurface : remplacé par OverlayHost::content_client_rect (ajout au contrat)"

[[module.non_porte]]
cas = "les `console.error` autour de toDOM / mounted / destroy"
raison = "pas de try/catch silencieux en Rust ; `DomBuild::Failed` couvre le cas « toDOM a levé »"

