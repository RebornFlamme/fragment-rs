[package]
name = "fragment-app"
description = "Fragment : fenêtres, boot, coffres (main.rs)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fragment"
path = "src/main.rs"

# Rejoue les scènes de pixels/scenes/*.json et capture le framebuffer (CI : job `pixels`).
[[bin]]
name = "fragment-pixels"
path = "src/bin/fragment-pixels.rs"
required-features = ["pixels"]

# ★ Le lecteur de scènes (src/pixels/) est AUSSI compilé comme cible de test : `cargo test
# --workspace` exerce ainsi le schéma JSON, les entrées simulées et la vue jouet sans la feature
# `pixels` (le job de tests Windows n'active aucune feature). Le fichier est la racine de la cible,
# d'où les chemins `super::` seuls dans ses modules.
[[test]]
name = "pixels"
path = "src/pixels/mod.rs"

[features]
# `Window::render_to_image` n'existe que sous la feature de test de GPUI.
# ★ `bench-support` de GPUI expose `Window::rendered_scene` (lecture seule de la scène peinte) : les
# boîtes exactes des glyphes et des icônes (fr-p3.1). Elle n'ajoute que des accesseurs et le journal du
# profileur (incrustation de débogage masquée par défaut) : ni le rastériseur, ni l'atlas, ni le
# cadencement des images ne changent.
pixels = ["gpui-kit/test-support", "dep:gpui-pre"]

[dependencies]
gpui-kit.workspace = true
gpui-pre = { workspace = true, optional = true, features = ["bench-support"] }
anyhow.workspace = true
# Le lecteur de scènes : schéma JSON, erreurs typées, commandes `pixels:*`, thème, PNG.
fragment-core = { path = "../fragment-core" }
fragment-theme = { path = "../fragment-theme" }
fragment-ui = { path = "../fragment-ui" }
# Le registre des coffres (config.json de userData) : choix du coffre au démarrage.
fragment-cli = { path = "../fragment-cli" }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# La boîte native de choix de dossier du gestionnaire de coffres (fr-t2-gestionnaire, NOUVELLE
# dépendance notée dans la PR). Sans GTK : sous Linux, `zenity` (coffre.rs::choisir_dossier).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
# Vue jouet : TestAppContext et render_to_image dans les tests du lecteur.
gpui-kit = { workspace = true, features = ["test-support"] }

# ★ Déjà dans l'arbre (gpui la tire) : aucune nouvelle crate, seulement une dépendance directe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
