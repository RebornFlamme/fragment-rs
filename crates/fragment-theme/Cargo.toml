[package]
name = "fragment-theme"
description = "Thème : jetons (noms d'Obsidian, valeurs de Fragment), themeModel, cascade (S4)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Le canal `theme:manager@1` est un RegistryDefinition du cœur.
fragment-core = { path = "../fragment-core" }
# Tri « sensibilité base » de lister_themes (accents ignorés) ; déjà dans Cargo.lock (fragment-core).
unicode-normalization = "0.1"
# Lecture de l'objet plat d'un `theme.json` (`surcharges_depuis_json`) ; déjà dans le workspace.
serde_json.workspace = true

[dev-dependencies]
# Lecture des captures de référence (pixels/reference) par les tests de color-mix.
image.workspace = true

[lints]
workspace = true
