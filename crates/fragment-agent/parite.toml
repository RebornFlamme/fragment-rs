# Parité des tests de fragment-agent : un tableau par module Rust.
# `source` = cas de test (it/test) dans le .test.ts d'origine ;
# `portes` = cas portés en #[test] ; `non_portes` = ce qui reste, avec sa raison.
# Les tests AJOUTÉS par le port (absents du TS) ne sont pas comptés ici.
# Chemins TS relatifs à `app/src/ui/views/agent/` de Fragment.

[contrat]
ts = "contract.ts + types.ts + api.ts"
tests_ts = ""   # types seulement : pas de test TS ; deux tests de sérialisation ajoutés par le port
source = 0
portes = 0
non_portes = []

