[package]
name = "fragment-agent"
description = "Agent (modèles) : événements, trace, politiques, permissions, actions, skills, harness claude stream-json."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ★ Expressions régulières : les modèles TS en utilisent partout (famille d'outil, skills, tar…).
# Hors liste d'avance de program.md §4 : notée dans la PR.
regex = "1"
# ★ `Date.parse` des horodatages ISO du transcript (events.rs). Hors liste d'avance : notée dans la PR.
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }

# ★ `String.prototype.normalize('NFD')` de `idDe` (actions_model.rs). Hors liste d'avance : notée dans la PR.
unicode-normalization = "0.1"

[lints]
workspace = true
