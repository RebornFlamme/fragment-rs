# Table de parité de fragment-core (program.md §6 et §7 : `cargo xtask parite` la
# régénère en table dans docs/parite-tests.md ; en attendant l'outil, elle est tenue
# à la main). Un `[[module]]` par fichier TS porté ; `cas_source` = nombre de `it(…)`
# du `.test.ts` ; `cas_portes` = ceux qui ont un `#[test]` du même nom en snake_case ;
# `cas_ajoutes` = tests Rust sans équivalent TS ; `non_portes` = ce qui ne l'est pas, et pourquoi.

[crate]
name = "fragment-core"
tache = "fr-p1-core-a"
reference = "RebornFlamme/Fragment @ 83731579"

