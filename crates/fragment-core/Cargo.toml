[package]
name = "fragment-core"
description = "Component/register*, registres, événements, portées clavier, commandes, plugins, Vault, documents, modèle du workspace, utilitaires purs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ★ Jamais gpui-kit ici : le cœur ne connaît aucune vue (program.md §9).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Journal des avertissements (les `console.warn/error` de Fragment) : façade, sans sortie imposée.
log = "0.4"
# Positions UTF-16 (ADR-004) : conversion octets <-> unités de code.
fragment-text = { path = "../fragment-text" }
# Pliage des accents de la recherche floue (`normalize('NFD')` de fuzzySearch.ts).
unicode-normalization = "0.1"
# Surveillance du coffre (fr-t2-fs) : inotify sous Linux, ReadDirectoryChangesW sous Windows.
notify = "8"
# Corbeille de l'OS (`trashSystem`), repliée sur la corbeille locale quand elle refuse.
trash = "5"

[lints]
workspace = true

[dev-dependencies]
# Dossiers temporaires des tests sur un vrai disque (fr-t2-fs).
tempfile = "3"
