# Parité de fr-t2-vault (fragment-core). Schéma `parite.d` : un fichier par tâche, fusionné
# par `cargo xtask parite` (fr-p3-socle). Aucun test unitaire côté TS pour le coffre :
# `cas_source = 0`, tous les tests sont AJOUTÉS (crates/fragment-core/tests/vault.rs),
# écrits d'après le comportement du code source et les décisions de Fragment.

[[module]]
ts = "app/src/ui/core/vault/vault.ts"
rs = "crates/fragment-core/src/vault/coffre.rs"
cas_source = 0
cas_portes = 0
cas_ajoutes = 95
notes = "Arène indexée par chemin, instantanés TFile/TFolder identifiés par FileId (pas de Rc<RefCell>). API synchrone. Ajouts : refus de renommer/supprimer la racine (VaultError::Racine), un seul événement rename pour un dossier (comme le TS), delete/trash annoncent chaque descendant feuilles d'abord. `process` n'a plus de file de promesses (tout est synchrone)."

